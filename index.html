<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>歩きスマホ実験</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #111827;
    color: white;
}
body {
    display: flex;
    justify-content: center;
    align-items: center;
}
button {
    font-family: inherit;
    touch-action: manipulation;
}
.hidden {
    display: none !important;
}
/* =========================
   全体
========================= */
#app-container {
    width: 100%;
    height: 100dvh;
    max-width: 520px;
    position: relative;
    overflow: hidden;
    background: #172033;
}
/* =========================
   共通画面
========================= */
.screen {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
/* =========================
   スタート画面
========================= */
#start-screen {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 28px;
    text-align: center;
}
.start-icon {
    font-size: 56px;
    margin-bottom: 18px;
}
#start-screen h1 {
    font-size: 25px;
    line-height: 1.4;
    margin-bottom: 22px;
}
.instructions {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px;
    text-align: left;
    margin-bottom: 25px;
}
.instructions p {
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 8px;
}
.instructions p:last-child {
    margin-bottom: 0;
}
.start-note {
    font-size: 12px;
    color: #aeb7c8;
    margin-bottom: 20px;
}
.main-btn {
    width: min(90%, 330px);
    min-height: 58px;
    border: none;
    border-radius: 30px;
    background: #ef476f;
    color: white;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 6px 18px rgba(239,71,111,0.3);
}
/* =========================
   ゲーム画面
========================= */
#game-screen {
    background: #263746;
}
/* 背景Canvas */
#game-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    touch-action: none;
}
/* =========================
   HUD
========================= */
#hud {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: rgba(0,0,0,0.72);
    border-radius: 16px;
    z-index: 20;
    font-size: 15px;
    font-weight: bold;
    pointer-events: none;
}
.hud-danger {
    color: #ff667f;
}
/* =========================
   スマホ画面
========================= */
#phone-frame {
    position: absolute;
    z-index: 10;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(76vw, 320px);
    height: min(58vh, 440px);
    min-height: 340px;
    background: #f4f4f4;
    border: 4px solid #202020;
    border-radius: 28px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: #222;
    box-shadow:
        0 12px 35px rgba(0,0,0,0.6),
        0 0 0 2px rgba(255,255,255,0.15);
}
/* スマホ上部 */
#phone-header {
    height: 50px;
    flex-shrink: 0;
    background: #075e54;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-size: 14px;
    font-weight: bold;
}
/* チャット */
#chat-body {
    flex: 1;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 9px;
    overflow-y: auto;
    background:
        linear-gradient(
            rgba(229,221,213,0.96),
            rgba(229,221,213,0.96)
        );
    overscroll-behavior: contain;
}
.chat-bubble {
    max-width: 82%;
    padding: 10px 13px;
    border-radius: 15px;
    background: white;
    font-size: 13px;
    line-height: 1.45;
    text-align: left;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.chat-bubble.user {
    align-self: flex-end;
    background: #dcf8c6;
}
/* 選択肢 */
#chat-options {
    flex-shrink: 0;
    padding: 9px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    background: #eeeeee;
}
.option-btn {
    width: 100%;
    min-height: 42px;
    border: none;
    border-radius: 10px;
    background: #128c7e;
    color: white;
    font-size: 13px;
    font-weight: bold;
    padding: 8px 10px;
    touch-action: manipulation;
}
.option-btn:active {
    transform: scale(0.97);
    background: #0b766b;
}
/* =========================
   結果画面
========================= */
#result-screen {
    background: #111827;
    overflow-y: auto;
    padding:
        max(28px, env(safe-area-inset-top))
        18px
        max(30px, env(safe-area-inset-bottom))
        18px;
}
.result-inner {
    width: 100%;
    max-width: 450px;
    margin: 0 auto;
    padding-bottom: 30px;
}
.result-title {
    font-size: 23px;
    text-align: center;
    margin-bottom: 22px;
}
.result-card {
    background: #1f2937;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 12px;
    border: 1px solid #374151;
}
.result-label {
    color: #9ca3af;
    font-size: 13px;
    margin-bottom: 7px;
}
.result-value {
    font-size: 29px;
    font-weight: bold;
    color: #ff5c7a;
}
.result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
.result-grid .result-card {
    margin-bottom: 0;
}
.analysis {
    background: rgba(255,190,118,0.08);
    border-left: 4px solid #ffbe76;
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.7;
    margin-top: 12px;
}
.heatmap-title {
    font-size: 12px;
    color: #aaa;
    margin: 20px 0 8px;
}
#heatmap-canvas {
    display: block;
    width: 100%;
    max-width: 360px;
    height: auto;
    margin: 0 auto;
    background: #111;
    border: 1px solid #374151;
    border-radius: 10px;
}
.retry-btn {
    display: block;
    width: 100%;
    min-height: 54px;
    margin-top: 20px;
    border: none;
    border-radius: 27px;
    background: #ef476f;
    color: white;
    font-size: 17px;
    font-weight: bold;
}
/* =========================
   小さいスマホ
========================= */
@media (max-height: 700px) {
    #phone-frame {
        height: 54vh;
        min-height: 300px;
        bottom: 14px;
    }
    #phone-header {
        height: 42px;
    }
    .chat-bubble {
        font-size: 12px;
        padding: 7px 10px;
    }
    .option-btn {
        min-height: 36px;
        font-size: 12px;
    }
    #hud {
        height: 42px;
        font-size: 13px;
    }
}
</style>
</head>
<body>
<div id="app-container">
<!-- =========================
     START
========================== -->
<section id="start-screen" class="screen">
    <div class="start-icon">🚶‍♂️📱</div>
    <h1>歩きスマホ<br>危険察知実験</h1>
    <div class="instructions">
        <p>
            <b>①</b>
            中央のスマホに表示されるメッセージへ、
            できるだけ自然に返信してください。
        </p>
        <p>
            <b>②</b>
            返信をしながら、画面の周辺に突然出現する
            <b>🚲 🚗 🚶 ⚠️</b>
            を見つけたらタップしてください。
        </p>
        <p>
            <b>③</b>
            制限時間は <b>30秒</b> です。
        </p>
    </div>
    <div class="start-note">
        ※ 実験中は画面から目を離さず、安全な場所で実施してください。
    </div>
    <button class="main-btn" onclick="startGame()">
        実験を開始する
    </button>
</section>
<!-- =========================
     GAME
========================== -->
<section id="game-screen" class="screen hidden">
    <div id="hud">
        <div>
            ⏱ 残り
            <span id="timer">30</span>秒
        </div>
        <div class="hud-danger">
            ⚠️ 検知
            <span id="detected-count">0</span>
        </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <!-- スマホ画面 -->
    <div id="phone-frame">
        <div id="phone-header">
            💬 メッセージ
        </div>
        <div id="chat-body">
            <div class="chat-bubble">
                友達：今どこ？そろそろ着く？
            </div>
        </div>
        <div id="chat-options"></div>
    </div>
</section>
<!-- =========================
     RESULT
========================== -->
<section id="result-screen" class="screen hidden">
    <div class="result-inner">
        <div class="result-title">
            📊 実験結果
        </div>
        <div class="result-card">
            <div class="result-label">
                実験中の危険検知率
            </div>
            <div class="result-value" id="hazard-rate">
                0%
            </div>
        </div>
        <div class="result-grid">
            <div class="result-card">
                <div class="result-label">
                    危険出現数
                </div>
                <div class="result-value" id="total-hazards">
                    0
                </div>
            </div>
            <div class="result-card">
                <div class="result-label">
                    検知数
                </div>
                <div class="result-value" id="detected-result">
                    0
                </div>
            </div>
            <div class="result-card">
                <div class="result-label">
                    見落とし数
                </div>
                <div class="result-value" id="missed-result">
                    0
                </div>
            </div>
            <div class="result-card">
                <div class="result-label">
                    チャット返信数
                </div>
                <div class="result-value" id="chat-count">
                    0
                </div>
            </div>
        </div>
        <div class="analysis" id="analysis-text">
            実験結果を表示します。
        </div>
        <div class="heatmap-title">
            ▼ 危険の発生位置
            （🟢検知 / 🔴見落とし）
        </div>
        <canvas
            id="heatmap-canvas"
            width="360"
            height="230">
        </canvas>
        <button
            class="retry-btn"
            onclick="location.reload()">
            もう一度実験する
        </button>
    </div>
</section>
</div>
<script>
/* =========================================================
   実験データ
========================================================= */
const questions = [
    {
        q: "今どこ？そろそろ着く？",
        opts: [
            "あと5分で着く！",
            "今電車の中",
            "ごめん遅れる！"
        ]
    },
    {
        q: "課題の締め切りって今日だっけ？",
        opts: [
            "明日だよ！",
            "今日23:59まで！",
            "わからない"
        ]
    },
    {
        q: "夕飯何食べる？ラーメンにする？",
        opts: [
            "いいね！ラーメン！",
            "カフェが良い",
            "何でもいいよ"
        ]
    },
    {
        q: "来週のゼミのパワポできた？",
        opts: [
            "今作ってる！",
            "まだ全然…",
            "バッチリ完了！"
        ]
    },
    {
        q: "この後カラオケ行かない？",
        opts: [
            "行く！楽しみ",
            "今日は帰るね",
            "何人で行く？"
        ]
    },
    {
        q: "明日の予定って何時集合だっけ？",
        opts: [
            "10時集合！",
            "12時だったと思う",
            "確認してみる！"
        ]
    }
];
/* =========================================================
   変数
========================================================= */
const GAME_TIME = 30;
let gameTimer = GAME_TIME;
let timerInterval = null;
let spawnInterval = null;
let canvas = null;
let ctx = null;
let hazards = [];
let allHazardsHistory = [];
let detectedHazards = 0;
let chatReplies = 0;
let currentQuestionIndex = 0;
let gameRunning = false;
let roadOffset = 0;
/* =========================================================
   DOM
========================================================= */
const startScreen =
    document.getElementById("start-screen");
const gameScreen =
    document.getElementById("game-screen");
const resultScreen =
    document.getElementById("result-screen");
const timerElement =
    document.getElementById("timer");
const detectedElement =
    document.getElementById("detected-count");
/* =========================================================
   実験開始
========================================================= */
function startGame() {
    gameRunning = true;
    startScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    canvas =
        document.getElementById("game-canvas");
    resizeCanvas();
    ctx =
        canvas.getContext("2d");
    hazards = [];
    allHazardsHistory = [];
    detectedHazards = 0;
    chatReplies = 0;
    gameTimer = GAME_TIME;
    currentQuestionIndex = 0;
    timerElement.innerText = gameTimer;
    detectedElement.innerText = "0";
    /*
     * イベントリスナーを一度だけ登録
     */
    canvas.removeEventListener(
        "pointerdown",
        handlePointer
    );
    canvas.addEventListener(
        "pointerdown",
        handlePointer,
        { passive: false }
    );
    loadQuestion(0);
    /*
     * 最初の危険を少し早めに出す
     */
    setTimeout(() => {
        if (gameRunning) {
            spawnHazard();
        }
    }, 1200);
    /*
     * 約1.5秒ごとに危険出現
     */
    spawnInterval =
        setInterval(() => {
            if (gameRunning) {
                spawnHazard();
            }
        }, 1500);
    /*
     * タイマー
     */
    timerInterval =
        setInterval(() => {
            if (!gameRunning) return;
            gameTimer--;
            timerElement.innerText =
                gameTimer;
            if (gameTimer <= 0) {
                endGame();
            }
        }, 1000);
    requestAnimationFrame(gameLoop);
}
/* =========================================================
   Canvasサイズ
========================================================= */
function resizeCanvas() {
    if (!canvas) return;
    const rect =
        canvas.getBoundingClientRect();
    const dpr =
        Math.min(window.devicePixelRatio || 1, 2);
    canvas.width =
        Math.floor(rect.width * dpr);
    canvas.height =
        Math.floor(rect.height * dpr);
    ctx =
        canvas.getContext("2d");
    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}
/* =========================================================
   質問表示
========================================================= */
function loadQuestion(index) {
    if (!gameRunning) return;
    currentQuestionIndex =
        index % questions.length;
    const question =
        questions[currentQuestionIndex];
    const chatBody =
        document.getElementById("chat-body");
    const options =
        document.getElementById("chat-options");
    /*
     * チャットが増えすぎないように
     * 古いメッセージを整理
     */
    while (chatBody.children.length > 6) {
        chatBody.removeChild(
            chatBody.firstElementChild
        );
    }
    const bubble =
        document.createElement("div");
    bubble.className =
        "chat-bubble";
    bubble.innerText =
        "友達：" + question.q;
    chatBody.appendChild(bubble);
    chatBody.scrollTop =
        chatBody.scrollHeight;
    options.innerHTML = "";
    question.opts.forEach((text) => {
        const button =
            document.createElement("button");
        button.className =
            "option-btn";
        button.innerText =
            text;
        button.addEventListener(
            "click",
            () => {
                handleChatReply(text);
            }
        );
        options.appendChild(button);
    });
}
/* =========================================================
   チャット返信
========================================================= */
function handleChatReply(replyText) {
    if (!gameRunning) return;
    const chatBody =
        document.getElementById("chat-body");
    const options =
        document.getElementById("chat-options");
    const userBubble =
        document.createElement("div");
    userBubble.className =
        "chat-bubble user";
    userBubble.innerText =
        replyText;
    chatBody.appendChild(
        userBubble
    );
    chatReplies++;
    chatBody.scrollTop =
        chatBody.scrollHeight;
    /*
     * 一度回答したらボタンを無効化
     */
    options.innerHTML =
        '<div style="font-size:11px;color:#777;text-align:center;">返信しました</div>';
    setTimeout(() => {
        if (gameRunning) {
            loadQuestion(
                currentQuestionIndex + 1
            );
        }
    }, 350);
}
/* =========================================================
   危険生成
========================================================= */
function spawnHazard() {
    if (!gameRunning || !canvas) return;
    const rect =
        canvas.getBoundingClientRect();
    const width =
        rect.width;
    const height =
        rect.height;
    /*
     * スマホ部分の実際の位置を取得
     */
    const phone =
        document
            .getElementById("phone-frame")
            .getBoundingClientRect();
    const canvasRect =
        canvas.getBoundingClientRect();
    const phoneLeft =
        phone.left - canvasRect.left;
    const phoneRight =
        phone.right - canvasRect.left;
    const phoneTop =
        phone.top - canvasRect.top;
    const phoneBottom =
        phone.bottom - canvasRect.top;
    let x = 0;
    let y = 0;
    let valid = false;
    let attempts = 0;
    /*
     * スマホの周囲に出す
     */
    while (!valid && attempts < 100) {
        attempts++;
        /*
         * 画面の端に近い場所を優先
         */
        const side =
            Math.floor(
                Math.random() * 4
            );
        if (side === 0) {
            // 左
            x =
                35 +
                Math.random() * 70;
            y =
                100 +
                Math.random() *
                Math.max(100, height - 180);
        }
        else if (side === 1) {
            // 右
            x =
                width -
                35 -
                Math.random() * 70;
            y =
                100 +
                Math.random() *
                Math.max(100, height - 180);
        }
        else if (side === 2) {
            // 上
            x =
                30 +
                Math.random() *
                Math.max(60, width - 60);
            y =
                80 +
                Math.random() * 80;
        }
        else {
            // 下
            x =
                30 +
                Math.random() *
                Math.max(60, width - 60);
            y =
                height -
                100 -
                Math.random() * 80;
        }
        /*
         * スマホに重ならないようにする
         */
        const margin = 45;
        const insidePhone =
            x >
                phoneLeft - margin &&
            x <
                phoneRight + margin &&
            y >
                phoneTop - margin &&
            y <
                phoneBottom + margin;
        if (!insidePhone) {
            valid = true;
        }
    }
    if (!valid) return;
    const types = [
        {
            icon: "🚲",
            label: "自転車"
        },
        {
            icon: "🚗",
            label: "車"
        },
        {
            icon: "🚶",
            label: "歩行者"
        },
        {
            icon: "⚠️",
            label: "危険"
        }
    ];
    const type =
        types[
            Math.floor(
                Math.random() *
                types.length
            )
        ];
    const hazard = {
        id:
            Date.now() +
            Math.random(),
        x: x,
        y: y,
        icon:
            type.icon,
        label:
            type.label,
        radius: 27,
        /*
         * 約2.5秒
         */
        life: 150,
        detected: false
    };
    hazards.push(hazard);
    allHazardsHistory.push(hazard);
}
/* =========================================================
   タップ判定
========================================================= */
function handlePointer(event) {
    if (!gameRunning) return;
    event.preventDefault();
    const rect =
        canvas.getBoundingClientRect();
    const x =
        event.clientX -
        rect.left;
    const y =
        event.clientY -
        rect.top;
    checkHazardHit(x, y);
}
/* =========================================================
   危険タップ
========================================================= */
function checkHazardHit(x, y) {
    if (!gameRunning) return;
    let hit = false;
    hazards.forEach((hazard) => {
        if (hazard.detected) return;
        const distance =
            Math.hypot(
                hazard.x - x,
                hazard.y - y
            );
        /*
         * 判定範囲を大きめにする
         */
        if (
            distance <
            hazard.radius + 24
        ) {
            hazard.detected = true;
            detectedHazards++;
            detectedElement.innerText =
                detectedHazards;
            hit = true;
        }
    });
    /*
     * 検知したときの短いフィードバック
     */
    if (hit) {
        navigator.vibrate?.(30);
    }
}
/* =========================================================
   背景描画
========================================================= */
function drawBackground(
    width,
    height
) {
    /*
     * 道路
     */
    ctx.fillStyle =
        "#34495e";
    ctx.fillRect(
        0,
        0,
        width,
        height
    );
    /*
     * 道路の中央ライン
     */
    roadOffset =
        (roadOffset + 2.5) % 50;
    ctx.strokeStyle =
        "rgba(255,255,255,0.35)";
    ctx.lineWidth =
        3;
    ctx.setLineDash(
        [22, 28]
    );
    ctx.lineDashOffset =
        -roadOffset;
    ctx.beginPath();
    ctx.moveTo(
        width * 0.25,
        0
    );
    ctx.lineTo(
        width * 0.25,
        height
    );
    ctx.moveTo(
        width * 0.75,
        0
    );
    ctx.lineTo(
        width * 0.75,
        height
    );
    ctx.stroke();
    ctx.setLineDash([]);
    /*
     * 視野を表す薄い円
     */
    const centerX =
        width / 2;
    const centerY =
        height * 0.52;
    const gradient =
        ctx.createRadialGradient(
            centerX,
            centerY,
            50,
            centerX,
            centerY,
            Math.max(width, height) * 0.7
        );
    gradient.addColorStop(
        0,
        "rgba(255,255,255,0.03)"
    );
    gradient.addColorStop(
        1,
        "rgba(0,0,0,0.15)"
    );
    ctx.fillStyle =
        gradient;
    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}
/* =========================================================
   ゲームループ
========================================================= */
function gameLoop() {
    if (!gameRunning) return;
    const rect =
        canvas.getBoundingClientRect();
    const width =
        rect.width;
    const height =
        rect.height;
    ctx.clearRect(
        0,
        0,
        width,
        height
    );
    drawBackground(
        width,
        height
    );
    /*
     * 危険描画
     */
    hazards.forEach((hazard) => {
        hazard.life--;
        if (
            hazard.life <= 0 &&
            !hazard.detected
        ) {
            return;
        }
        if (hazard.detected) {
            /*
             * 検知済み表示
             */
            ctx.font =
                "bold 18px Arial";
            ctx.textAlign =
                "center";
            ctx.textBaseline =
                "middle";
            ctx.fillStyle =
                "#2ecc71";
            ctx.fillText(
                "✓",
                hazard.x,
                hazard.y
            );
            return;
        }
        /*
         * 点滅
         */
        const pulse =
            1 +
            Math.sin(
                hazard.life * 0.25
            ) * 0.12;
        ctx.beginPath();
        ctx.arc(
            hazard.x,
            hazard.y,
            hazard.radius * pulse,
            0,
            Math.PI * 2
        );
        ctx.fillStyle =
            "rgba(239,71,111,0.28)";
        ctx.fill();
        /*
         * タップしやすい視覚的サイズ
         */
        ctx.font =
            "32px Arial";
        ctx.textAlign =
            "center";
        ctx.textBaseline =
            "middle";
        ctx.fillStyle =
            "white";
        ctx.shadowColor =
            "rgba(0,0,0,0.8)";
        ctx.shadowBlur =
            6;
        ctx.fillText(
            hazard.icon,
            hazard.x,
            hazard.y
        );
        ctx.shadowBlur =
            0;
    });
    /*
     * 古い危険を削除
     */
    hazards =
        hazards.filter(
            hazard =>
                hazard.life > 0 &&
                !hazard.detected
        );
    requestAnimationFrame(
        gameLoop
    );
}
/* =========================================================
   実験終了
========================================================= */
function endGame() {
    if (!gameRunning) return;
    gameRunning = false;
    clearInterval(
        timerInterval
    );
    clearInterval(
        spawnInterval
    );
    timerInterval = null;
    spawnInterval = null;
    /*
     * 検知率
     */
    const total =
        allHazardsHistory.length;
    const detected =
        detectedHazards;
    const missed =
        Math.max(
            0,
            total - detected
        );
    const rate =
        total > 0
            ? Math.round(
                detected /
                total *
                100
            )
            : 0;
    /*
     * 結果画面
     */
    document
        .getElementById("hazard-rate")
        .innerText =
            rate + "%";
    document
        .getElementById("total-hazards")
        .innerText =
            total;
    document
        .getElementById("detected-result")
        .innerText =
            detected;
    document
        .getElementById("missed-result")
        .innerText =
            missed;
    document
        .getElementById("chat-count")
        .innerText =
            chatReplies;
    /*
     * 客観的な結果説明
     */
    let analysis = "";
    if (total === 0) {
        analysis =
            "実験中に危険イベントが発生しなかったため、検知率を算出できませんでした。もう一度実験してください。";
    }
    else {
        analysis =
            "30秒間の実験で " +
            total +
            "個の危険イベントが発生し、" +
            detected +
            "個を検知しました。" +
            "検知率は " +
            rate +
            "% でした。" +
            "チャットへの返信は " +
            chatReplies +
            "回でした。";
    }
    document
        .getElementById("analysis-text")
        .innerHTML =
            "<b>実験結果</b><br>" +
            analysis;
    /*
     * 画面切り替え
     */
    gameScreen.classList.add(
        "hidden"
    );
    resultScreen.classList.remove(
        "hidden"
    );
    drawHeatmap();
}
/* =========================================================
   ヒートマップ
========================================================= */
function drawHeatmap() {
    const hm =
        document.getElementById(
            "heatmap-canvas"
        );
    const hctx =
        hm.getContext("2d");
    const width =
        hm.width;
    const height =
        hm.height;
    /*
     * 背景
     */
    hctx.fillStyle =
        "#111827";
    hctx.fillRect(
        0,
        0,
        width,
        height
    );
    /*
     * 道路
     */
    hctx.fillStyle =
        "#263746";
    hctx.fillRect(
        width * 0.2,
        0,
        width * 0.6,
        height
    );
    /*
     * スマホ
     */
    const phoneW =
        85;
    const phoneH =
        105;
    const phoneX =
        width / 2 -
        phoneW / 2;
    const phoneY =
        height -
        phoneH -
        12;
    hctx.fillStyle =
        "#444";
    hctx.fillRect(
        phoneX,
        phoneY,
        phoneW,
        phoneH
    );
    hctx.strokeStyle =
        "#888";
    hctx.strokeRect(
        phoneX,
        phoneY,
        phoneW,
        phoneH
    );
    hctx.fillStyle =
        "#aaa";
    hctx.font =
        "11px Arial";
    hctx.textAlign =
        "center";
    hctx.fillText(
        "スマホ",
        width / 2,
        phoneY + phoneH / 2
    );
    /*
     * 危険位置
     */
    if (!canvas) return;
    const canvasRect =
        canvas.getBoundingClientRect();
    const originalWidth =
        canvasRect.width;
    const originalHeight =
        canvasRect.height;
    if (
        originalWidth <= 0 ||
        originalHeight <= 0
    ) return;
    allHazardsHistory.forEach(
        (hazard) => {
            const x =
                hazard.x /
                originalWidth *
                width;
            const y =
                hazard.y /
                originalHeight *
                height;
            hctx.beginPath();
            hctx.arc(
                x,
                y,
                6,
                0,
                Math.PI * 2
            );
            hctx.fillStyle =
                hazard.detected
                    ? "#2ecc71"
                    : "#ef476f";
            hctx.fill();
        }
    );
    /*
     * 凡例
     */
    hctx.font =
        "10px Arial";
    hctx.textAlign =
        "left";
    hctx.fillStyle =
        "#2ecc71";
    hctx.fillText(
        "● 検知",
        8,
        15
    );
    hctx.fillStyle =
        "#ef476f";
    hctx.fillText(
        "● 見落とし",
        65,
        15
    );
}
/* =========================================================
   画面サイズ変更
========================================================= */
window.addEventListener(
    "resize",
    () => {
        if (
            gameRunning &&
            canvas
        ) {
            resizeCanvas();
        }
    }
);
</script>
